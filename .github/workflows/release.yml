name: Release

# Tag a version and the downloads build themselves:
#     git tag v1.0 && git push origin v1.0
#
# Note what this does NOT do: notarize. That needs a paid Apple Developer ID,
# so the artifacts are ad-hoc signed and macOS asks the user to confirm the app
# once on first launch. The README documents that step — if a Developer ID is
# ever added, sign and notarize here and the instructions can go.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build universal downloads
        run: make release

      - name: Check the binary really is universal
        run: |
          archs=$(lipo -archs dist/Zielzeit.app/Contents/MacOS/Zielzeit)
          echo "architectures: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::not a universal binary ($archs)"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Zielzeit
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.dmg
          body: |
            ## Install

            1. Download **Zielzeit.dmg** below, open it, and drag Zielzeit to Applications.
            2. Open it from Applications. macOS will say it "cannot be opened because Apple
               cannot check it for malicious software" — that is expected: this app is
               open source and ad-hoc signed, but not notarized (that needs a paid Apple
               Developer account).
            3. Go to **System Settings → Privacy & Security**, scroll down, and click
               **Open Anyway**. You only do this once.

            Zielzeit then walks you through connecting to your Scalable Capital account.
            See the [README](https://github.com/Mannafee/zielzeit#readme) for the full
            setup, including the one Terminal step the Scalable CLI requires.
